[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgml-pipeline"
version = "0.1.0"
description = "ReVMAP knowledge-graph pipeline for target-contextualized drug-action prediction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scikit-learn>=1.2",
  "torch>=2.0",
  "pykeen>=1.10",
  "pyarrow>=10.0",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "rdkit>=2024.3",
]
keywords = ["knowledge-graph", "drug-repurposing", "moa", "pykeen", "bioinformatics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
kgml-pipeline = "kgml_pipeline.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
